    <style>
        /* --- 2. MASTER CSS ARCHITECTURE --- */
        :root {
            --hue: 260; /* Wagon Purple */
            --c-prim: hsl(var(--hue), 90%, 60%);
            --c-bg: #030005;
            --glass: rgba(15, 15, 25, 0.85);
            --bord: 1px solid rgba(168, 85, 247, 0.3);
            --font-display: 'Eagle Lake', cursive;
            --font-ui: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-head: 'Orbitron', sans-serif;
            --p-glow: 0 0 20px rgba(168, 85, 247, 0.5);
            --taskbar-h: 48px;
            --z-desktop: 10; --z-win: 100; --z-top: 5000; --z-lock: 9999;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }
        body { background: var(--c-bg); color: #fff; font-family: var(--font-ui); height: 100vh; overflow: hidden; cursor: default; }

        /* --- FX LAYERS --- */
        #wallpaper { position: fixed; inset: 0; background: radial-gradient(circle at center, #1a0b2e 0%, #000 90%); z-index: 0; }
        #matrix-canvas, #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #matrix-canvas { z-index: 1; opacity: 0.1; }
        #particle-canvas { z-index: 2; opacity: 0.4; }
        .scanline { 
            position: fixed; inset: 0; pointer-events: none; z-index: var(--z-lock);
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; 
        }

        /* --- LOCK SCREEN (PRESERVED STYLE) --- */
        #lock-screen {
            position: fixed; inset: 0; z-index: var(--z-lock);
            background: #000; display: flex; align-items: center; justify-content: center;
            transition: transform 0.8s cubic-bezier(0.7,0,0.3,1);
        }
        .login-box { 
            width: 350px; text-align: center; padding: 40px; 
            border: var(--bord); background: rgba(10,5,20,0.9); 
            box-shadow: var(--p-glow); clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%); 
        }
        .login-box h1 { font-family: var(--font-head); color: var(--c-prim); letter-spacing: 5px; margin-bottom: 20px; }
        .pass-input { 
            width: 100%; background: transparent; border: none; border-bottom: 2px solid #333; 
            color: #fff; font-family: var(--font-mono); text-align: center; font-size: 1.2rem; 
            padding: 10px; transition: 0.3s; 
        }
        .pass-input:focus { border-color: var(--c-prim); box-shadow: 0 10px 10px -10px var(--c-prim); }

        /* --- DESKTOP ENVIRONMENT --- */
        #desktop {
            position: absolute; inset: 0; bottom: var(--taskbar-h);
            z-index: var(--z-desktop); padding: 20px;
            display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 20px;
        }
        .d-icon {
            width: 90px; text-align: center; cursor: pointer; padding: 10px;
            border: 1px solid transparent; border-radius: 6px; transition: 0.2s;
            color: #ccc; text-shadow: 0 2px 4px #000;
        }
        .d-icon:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: #fff; }
        .d-icon i { font-size: 38px; color: var(--c-prim); margin-bottom: 5px; display: block; filter: drop-shadow(0 0 10px var(--c-prim)); }
        .d-icon span { font-size: 12px; font-weight: bold; line-height: 1.2; }

        /* --- WINDOW SYSTEM --- */
        #window-area { position: absolute; inset: 0; pointer-events: none; z-index: var(--z-win); }
        .window {
            position: absolute; background: var(--glass); border: var(--bord);
            border-radius: 6px; backdrop-filter: blur(15px);
            display: flex; flex-direction: column; overflow: hidden; pointer-events: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            min-width: 300px; min-height: 200px;
            animation: openWin 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        @keyframes openWin { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .w-header {
            height: 36px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(168,85,247,0.2);
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px; cursor: grab;
        }
        .w-header:active { cursor: grabbing; }
        .w-title { font-family: var(--font-head); font-size: 11px; letter-spacing: 1px; color: #aaa; }
        .w-controls { display: flex; gap: 8px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
        .wb-close { background: #ff5f56; } .wb-min { background: #febc2e; } .wb-max { background: #28c840; }

        .w-content { flex: 1; overflow-y: auto; padding: 20px; position: relative; font-size: 14px; line-height: 1.6; }

        /* --- CONTENT STYLES (FROM ORIGINAL) --- */
        .hero-title { font-family: var(--font-display); font-size: 2.5rem; color: var(--c-prim); text-shadow: var(--p-glow); margin-bottom: 10px; text-align: center; }

        .stat-tag { background: rgba(168, 85, 247, 0.1); border: 1px solid var(--c-prim); padding: 5px 12px; font-size: 0.75rem; font-family: var(--font-mono); border-radius: 2px; }
        .overview-card { background: rgba(0,0,0,0.3); border: 1px solid #333; border-radius: 4px; padding: 15px; margin-top: 20px; }
        summary { font-weight: bold; color: var(--c-prim); cursor: pointer; padding: 8px 0; border-bottom: 1px solid #222; list-style: none; display: flex; justify-content: space-between; }
        .indented { padding-left: 20px; color: #bbb; font-size: 0.9rem; margin-top: 5px; }
        a { color: var(--c-prim); text-decoration: none; } a:hover { text-decoration: underline; }

        /* Terminal Style */
        .terminal { background: #000; color: #0f0; font-family: var(--font-mono); padding: 10px; height: 100%; font-size: 12px; }
        .term-input { background: transparent; border: none; color: #fff; width: 100%; font-family: inherit; }

        /* --- TASKBAR --- */
        #taskbar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: var(--taskbar-h);
            background: rgba(10, 5, 20, 0.95); border-top: 1px solid #333;
            z-index: var(--z-top); display: flex; align-items: center; padding: 0 10px;
        }
        #start-btn {
            background: rgba(168, 85, 247, 0.15); border: 1px solid var(--c-prim);
            color: var(--c-prim); padding: 6px 15px; border-radius: 4px;
            font-family: var(--font-head); font-size: 12px; font-weight: bold;
            display: flex; align-items: center; gap: 8px; cursor: pointer; margin-right: 15px;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }
        #start-btn:hover { background: var(--c-prim); color: #000; box-shadow: var(--p-glow); }
        
        .task-list { flex: 1; display: flex; gap: 5px; }
        .task-item {
            padding: 5px 15px; background: rgba(255,255,255,0.05); border-bottom: 2px solid transparent;
            color: #aaa; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px;
            max-width: 150px; white-space: nowrap; overflow: hidden; border-radius: 4px 4px 0 0;
        }
        .task-item.active { background: rgba(168, 85, 247, 0.1); border-color: var(--c-prim); color: #fff; }
        
        .tray { display: flex; gap: 15px; font-size: 12px; color: #888; font-family: var(--font-mono); align-items: center; margin-right: 10px; }

        /* --- WIDGETS --- */
        .music-widget {
            position: fixed; bottom: 70px; right: 20px;
            background: rgba(10,5,20,0.9); border: var(--bord); border-radius: 30px;
            padding: 8px 20px; display: flex; align-items: center; gap: 15px;
            z-index: var(--z-desktop); box-shadow: var(--p-glow);
        }
        .music-widget input { background: transparent; border: none; border-bottom: 1px solid #444; color: #fff; font-size: 0.7rem; width: 120px; }

        /* --- NOTIFICATIONS --- */
        #notif-area { position: fixed; top: 20px; right: 20px; z-index: var(--z-top); display: flex; flex-direction: column; gap: 10px; }
        .notif {
            width: 280px; background: rgba(20,20,30,0.95); border-left: 3px solid var(--c-prim);
            padding: 15px; color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease-out; font-size: 13px;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--c-prim); }
    </style>
</head>

                    <h3 style="font-family:'Orbitron'; font-size:12px; margin-bottom:10px; color:#aaa;">OPERATIONAL OVERVIEW</h3>
                    <details><summary>Home</summary><div class="indented">You are here.</div></details>
                    <details><summary>Bookmarkllection</summary><div class="indented">Collection of JS bookmarklets.</div></details>

            { id: 'nav', name: 'All Pages', icon: 'ph-list-numbers', w: 400, h: 300, type: 'link', url: 'Navigation.html' },
            { id: 'bm', name: 'Bookmarklets', icon: 'ph-bookmarks', w: 400, h: 300, type: 'link', url: 'Bookmarkllection.html' },
            { id: 'chrome', name: 'Chrome Kit', icon: 'ph-lock-key-open', w: 400, h: 300, type: 'link', url: 'Bypasser\'sChromekit.html' },
            { id: 'games', name: 'Gamellection', icon: 'ph-game-controller', w: 600, h: 400, type: 'link', url: 'Gamellection.html' },
            { id: 'prox', name: 'ProxNet', icon: 'ph-globe', w: 500, h: 400, type: 'link', url: 'ProxList.html' },
            { id: 'faq', name: 'FAQ', icon: 'ph-question', w: 400, h: 400, type: 'link', url: 'Questions.html' },
            { id: 'term', name: 'Terminal', icon: 'ph-terminal-window', w: 500, h: 300, type: 'terminal' },
            { id: 'settings', name: 'Config', icon: 'ph-gear', w: 350, h: 300, content: `
                <h3>System Config</h3>
                <div style="margin-top:15px;">
                    <label style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                        <input type="checkbox" checked onchange="document.getElementById('cloak-toggle').checked=this.checked"> Tab Cloaking
                    </label>
                    <label style="display:flex; align-items:center; gap:10px;">
                        <input type="checkbox" checked onchange="document.getElementById('matrix-canvas').style.display=this.checked?'block':'none'"> Matrix FX
                    </label>
                </div>
                <div style="margin-top:20px; font-size:10px; color:#555;">
                    WagonOS v10.0 // HTML_FLAVOR<br>
                    UID: ROOT_ADMIN
                </div>
            `}
        ];

        const System = {
            init() {
                this.setupLock();
                this.setupClock();
                this.setupParticles();
                this.setupMatrix();
                this.setupSecurity();
                this.renderDesktop();
                
                // Panic Key (Preserved)
                document.addEventListener('keydown', (e) => {
                    if(e.key === '`' || e.key === '~') {
                        document.body.innerHTML = "";
                        window.location.replace(CONFIG.panicUrl);
                    }
                });
            },

            setupLock() {
                const pin = document.getElementById('pass-input');
                pin.addEventListener('keydown', (e) => {
                    if(e.key === 'Enter') {
                        if(pin.value.toLowerCase() === 'wagon' || pin.value === 'admin') {
                            document.getElementById('lock-screen').style.transform = "translateY(-100%)";
                            this.playSound('login');
                            WindowManager.open('home'); // Auto-open Home
                        } else {
                            pin.style.borderColor = 'red';
                            document.getElementById('lock-msg').innerText = "ACCESS DENIED";
                            setTimeout(() => { pin.style.borderColor = '#333'; document.getElementById('lock-msg').innerText=""; }, 1000);
                        }
                    }
                });
                pin.focus();
            },

            setupClock() {
                setInterval(() => {
                    document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString('en-GB');
                }, 1000);
            },

            setupSecurity() {
                // Cloaking
                document.addEventListener('visibilitychange', () => {
                    if(document.hidden) document.title = "My Drive - Google Drive";
                    else document.title = "Home | The Wagon Site OS";
                });
                
                // Konami
                const code = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
                let idx = 0;
                document.addEventListener('keydown', (e) => {
                    if(e.key === code[idx]) {
                        idx++;
                        if(idx === code.length) {
                            document.documentElement.style.setProperty('--c-prim', '#ff0000');
                            this.notify("GOD MODE", "System limits removed.");
                            idx = 0;
                        }
                    } else idx = 0;
                });
            },

            renderDesktop() {
                const d = document.getElementById('desktop');
                APPS.forEach(app => {
                    const icon = document.createElement('div');
                    icon.className = 'd-icon';
                    icon.innerHTML = `<i class="ph ${app.icon}"></i><span>${app.name}</span>`;
                    icon.onclick = () => WindowManager.open(app.id);
                    d.appendChild(icon);
                });
            },

            notify(title, msg) {
                const area = document.getElementById('notif-area');
                const n = document.createElement('div');
                n.className = 'notif';
                n.innerHTML = `<strong style="color:var(--c-prim)">${title}</strong><br>${msg}`;
                area.appendChild(n);
                setTimeout(() => n.remove(), 4000);
                this.playSound('notif');
            },

            toggleAudio() {
                const a = document.getElementById('bg-music'), src = document.getElementById('music-src').value, btn = document.getElementById('play-btn');
                if(a.paused && src) { a.src = src; a.play(); btn.classList.replace('ph-play', 'ph-pause'); }
                else { a.pause(); btn.classList.replace('ph-pause', 'ph-play'); }
            },

            setupParticles() {
                const c = document.getElementById('particle-canvas'), ctx = c.getContext('2d'), p = [];
                const res = () => { c.width = innerWidth; c.height = innerHeight; };
                window.addEventListener('resize', res); res();
                class Part {
                    constructor() { this.reset(); }
                    reset() { this.x = Math.random()*c.width; this.y = Math.random()*c.height; this.s = Math.random()*2; this.vx = (Math.random()-0.5)*0.5; this.vy = (Math.random()-0.5)*0.5; }
                    up() { this.x += this.vx; this.y += this.vy; if(this.x<0||this.x>c.width||this.y<0||this.y>c.height) this.reset(); }
                    dr() { ctx.fillStyle = 'rgba(168,85,247,0.4)'; ctx.fillRect(this.x, this.y, this.s, this.s); }
                }
                for(let i=0; i<60; i++) p.push(new Part());
                const a = () => { ctx.clearRect(0,0,c.width,c.height); p.forEach(i=>{i.up();i.dr();}); requestAnimationFrame(a); };
                a();
            },

            setupMatrix() {
                const c = document.getElementById('matrix-canvas'), ctx = c.getContext('2d');
                c.width = innerWidth; c.height = innerHeight;
                const cols = Math.floor(c.width/20), y = Array(cols).fill(0);
                setInterval(() => {
                    ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,c.width,c.height);
                    ctx.fillStyle = '#a855f7'; ctx.font = '15px monospace';
                    y.forEach((val, i) => {
                        ctx.fillText(String.fromCharCode(Math.random()*128), i*20, val);
                        y[i] = (val > 100 + Math.random()*10000) ? 0 : val+20;
                    });
                }, 50);
            },

            playSound(t) {
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                const o = ac.createOscillator(), g = ac.createGain();
                o.connect(g); g.connect(ac.destination);
                o.frequency.value = t === 'login' ? 440 : 800;
                g.gain.value = 0.05; o.start();
                g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (t==='login'?0.5:0.1));
                o.stop(ac.currentTime + 0.5);
            }
        };

        const WindowManager = {
            zIndex: 100,
            windows: {},
            
            open(id) {
                if(this.windows[id]) return this.focus(id);
                const app = APPS.find(a => a.id === id);
                if(!app) return;

                // Handle Redirect Links separately
                if(app.type === 'link') {
                    System.notify("Redirecting", `Connecting to ${app.name}...`);
                    setTimeout(() => window.location.href = CONFIG.repo + app.url, 1000);
                    return;
                }

                const w = document.createElement('div');
                w.className = 'window';
                w.id = `win-${id}`;
                w.style.width = app.w + 'px';
                w.style.height = app.h + 'px';
                w.style.left = (50 + Math.random()*50) + 'px';
                w.style.top = (50 + Math.random()*50) + 'px';
                w.style.zIndex = ++this.zIndex;
                
                let html = `
                    <div class="w-header" onmousedown="WindowManager.drag(event, '${id}')">
                        <div class="w-title"><i class="ph-fill ${app.icon}"></i> ${app.name.toUpperCase()}</div>
                        <div class="w-controls">
                            <div class="win-btn wb-min" onclick="WindowManager.min('${id}')"></div>
                            <div class="win-btn wb-max" onclick="WindowManager.max('${id}')"></div>
                            <div class="win-btn wb-close" onclick="WindowManager.close('${id}')"></div>
                        </div>
                    </div>
                    <div class="w-content" id="body-${id}">${app.content || ''}</div>
                `;
                w.innerHTML = html;
                w.onmousedown = () => this.focus(id);
                document.getElementById('window-area').appendChild(w);
                this.windows[id] = w;
                this.addTask(id, app);

                if(app.type === 'terminal') this.initTerm(id);
            },

            close(id) {
                if(this.windows[id]) {
                    this.windows[id].remove();
                    delete this.windows[id];
                    document.getElementById(`task-${id}`).remove();
                }
            },
            min(id) { this.windows[id].style.display='none'; document.getElementById(`task-${id}`).classList.remove('active'); },
            max(id) { 
                const w = this.windows[id];
                if(w.style.width==='100%') { 
                    const a = APPS.find(x=>x.id===id);
                    w.style.width=a.w+'px'; w.style.height=a.h+'px'; w.style.top='50px'; w.style.left='50px';
                } else { w.style.width='100%'; w.style.height='100%'; w.style.top='0'; w.style.left='0'; }
            },
            focus(id) {
                const w = this.windows[id];
                if(!w) return;
                w.style.display = 'flex';
                w.style.zIndex = ++this.zIndex;
                document.querySelectorAll('.task-item').forEach(t => t.classList.remove('active'));
                document.getElementById(`task-${id}`).classList.add('active');
            },
            addTask(id, app) {
                const t = document.createElement('div');
                t.className = 'task-item active';
                t.id = `task-${id}`;
                t.innerHTML = `<i class="ph-fill ${app.icon}"></i> ${app.name}`;
                t.onclick = () => this.focus(id);
                document.getElementById('task-list').appendChild(t);
            },
            drag(e, id) {
                const w = this.windows[id];
                let sx = e.clientX - w.offsetLeft, sy = e.clientY - w.offsetTop;
                function mv(ev) { w.style.left = (ev.clientX - sx) + 'px'; w.style.top = (ev.clientY - sy) + 'px'; }
                function up() { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }
                document.addEventListener('mousemove', mv);
                document.addEventListener('mouseup', up);
            },

            initTerm(id) {
                const b = document.getElementById(`body-${id}`);
                b.innerHTML = `
                    <div class="terminal" id="out-${id}">
                        <div>> WAGON_OS v10.0 INITIALIZED</div>
                        <div>> TYPE 'help' FOR COMMANDS</div><br>
                        <div style="display:flex;"><span>> </span><input type="text" class="term-input" id="in-${id}" autocomplete="off"></div>
                    </div>
                `;
                const inp = document.getElementById(`in-${id}`), out = document.getElementById(`out-${id}`);
                inp.focus();
                inp.onkeydown = (e) => {
                    if(e.key === 'Enter') {
                        const cmd = inp.value.trim().toLowerCase();
                        const line = document.createElement('div'); line.innerHTML = `> ${cmd}`;
                        out.insertBefore(line, inp.parentElement);
                        inp.value = '';
                        
                        let msg = "";
                        if(cmd === 'help') msg = "CMDS: clear, panic, bear, date, system, whoami";
                        else if(cmd === 'clear') { out.innerHTML=''; out.appendChild(inp.parentElement); return; }
                        else if(cmd === 'bear') msg = "DESMOND IS WATCHING YOU.";
                        else if(cmd === 'system') msg = "OS: Wagon Ultimate v10 // HTML5";
                        else if(cmd === 'panic') window.location.replace(CONFIG.panicUrl);
                        else msg = `ERR: '${cmd}' UNKNOWN`;

                        if(msg) {
                            const r = document.createElement('div'); r.style.color="#ccc"; r.innerText = msg;
                            out.insertBefore(r, inp.parentElement);
                        }
                    }
                };
            }
        };

        window.onload = () => System.init();
    </script>
</body>
</html>
