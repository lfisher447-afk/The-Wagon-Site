<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WagonOS | Secure Environment</title>
    
    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* --- 1. CORE VARIABLES & THEME --- */
        :root {
            --primary: #a855f7;       /* Wagon Purple */
            --primary-dim: rgba(168, 85, 247, 0.3);
            --accent: #00ffff;        /* Cyber Cyan */
            --bg-dark: #030005;
            --glass: rgba(18, 18, 24, 0.75);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --glass-highlight: 1px solid rgba(168, 85, 247, 0.5);
            --font-ui: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-head: 'Orbitron', sans-serif;
            --taskbar-h: 45px;
            --z-desktop: 10; --z-window: 100; --z-taskbar: 1000; --z-lock: 9999;
        }

        * { box-sizing: border-box; user-select: none; outline: none; }
        body {
            margin: 0; padding: 0;
            background: #000;
            font-family: var(--font-ui);
            height: 100vh; width: 100vw; overflow: hidden;
            color: #fff; cursor: default;
        }

        /* --- 2. BACKGROUND EFFECTS --- */
        #wallpaper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a0b2e 0%, #000 90%);
            z-index: 0;
        }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #matrix-canvas { z-index: 1; opacity: 0.15; }
        #crt-scanline {
            position: fixed; inset: 0; z-index: 99999; pointer-events: none;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
            background-size: 100% 3px, 3px 100%;
        }

        /* --- 3. BOOT SCREEN --- */
        #boot-screen {
            position: fixed; inset: 0; background: #000; z-index: var(--z-lock);
            padding: 40px; font-family: var(--font-mono); color: var(--primary); font-size: 14px;
            display: flex; flex-direction: column;
        }
        .boot-line { margin-bottom: 5px; }
        .success { color: #0f0; } .warn { color: #ff0; }

        /* --- 4. LOCK SCREEN --- */
        #lock-screen {
            position: fixed; inset: 0; z-index: var(--z-lock);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.6s cubic-bezier(0.7,0,0.3,1);
        }
        .login-box {
            width: 400px; padding: 40px;
            background: rgba(10,10,15,0.6); border: var(--glass-highlight);
            box-shadow: 0 0 40px var(--primary-dim);
            text-align: center; clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
        }
        .login-input {
            width: 100%; background: transparent; border: none; border-bottom: 2px solid #333;
            color: #fff; font-family: var(--font-head); font-size: 1.5rem; text-align: center;
            padding: 10px; margin-top: 20px; transition: 0.3s;
        }
        .login-input:focus { border-color: var(--primary); letter-spacing: 3px; }

        /* --- 5. DESKTOP & ICONS --- */
        #desktop {
            position: absolute; inset: 0; bottom: var(--taskbar-h);
            z-index: var(--z-desktop); padding: 20px;
            display: flex; flex-direction: column; flex-wrap: wrap; gap: 15px; align-content: flex-start;
        }
        .icon {
            width: 84px; height: 96px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; border-radius: 6px; border: 1px solid transparent;
            transition: 0.2s; cursor: pointer; color: #ddd; text-align: center;
        }
        .icon:hover { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .icon i { font-size: 36px; margin-bottom: 8px; color: var(--primary); filter: drop-shadow(0 0 8px var(--primary)); }
        .icon span { font-size: 12px; text-shadow: 0 2px 2px #000; line-height: 1.2; }

        /* --- 6. WINDOW MANAGER --- */
        #window-area { position: absolute; inset: 0; pointer-events: none; z-index: var(--z-window); }
        .window {
            position: absolute; background: var(--glass); backdrop-filter: blur(15px);
            border: var(--glass-border); border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; overflow: hidden; pointer-events: auto;
            min-width: 300px; min-height: 200px;
            animation: popIn 0.2s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .win-bar {
            height: 36px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
            cursor: grab;
        }
        .win-bar:active { cursor: grabbing; }
        .win-title { font-family: var(--font-head); font-size: 11px; letter-spacing: 1px; color: #aaa; }
        .win-controls { display: flex; gap: 8px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
        .wb-close { background: #ff5f56; } .wb-min { background: #febc2e; } .wb-max { background: #28c840; }

        .win-body { flex: 1; overflow-y: auto; padding: 0; position: relative; color: #eee; }
        .win-content-pad { padding: 20px; }
        
        /* Specific App Styles */
        .terminal { background: #050505; color: #0f0; font-family: var(--font-mono); padding: 10px; height: 100%; font-size: 13px; }
        .term-input { background: transparent; border: none; color: #fff; font-family: inherit; width: 100%; }
        
        iframe.app-frame { width: 100%; height: 100%; border: none; background: #fff; }

        /* --- 7. TASKBAR --- */
        #taskbar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: var(--taskbar-h);
            background: rgba(5, 5, 10, 0.9); border-top: 1px solid #333;
            z-index: var(--z-taskbar); display: flex; align-items: center; padding: 0 10px;
        }
        #start-btn {
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: #fff; padding: 6px 14px; border-radius: 4px;
            font-family: var(--font-head); font-size: 12px; font-weight: bold;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            box-shadow: 0 0 10px var(--primary-dim);
        }
        #start-btn:hover { filter: brightness(1.2); }
        
        .task-list { flex: 1; display: flex; margin-left: 15px; gap: 4px; }
        .task-item {
            width: 140px; padding: 5px 10px; background: rgba(255,255,255,0.05);
            border-bottom: 2px solid transparent; border-radius: 4px 4px 0 0;
            cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px;
            white-space: nowrap; overflow: hidden;
        }
        .task-item.active { background: rgba(168,85,247,0.15); border-color: var(--primary); color: #fff; }
        
        .tray { display: flex; gap: 15px; font-size: 12px; color: #aaa; font-family: var(--font-mono); align-items: center; margin-right: 10px; }

        /* --- 8. START MENU --- */
        #start-menu {
            position: absolute; bottom: 55px; left: 10px; width: 280px;
            background: rgba(10, 10, 15, 0.95); border: var(--glass-highlight);
            border-radius: 8px; padding: 10px; display: none; z-index: var(--z-taskbar);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .sm-item {
            padding: 10px; display: flex; align-items: center; gap: 10px;
            cursor: pointer; border-radius: 4px; transition: 0.2s;
        }
        .sm-item:hover { background: var(--primary); color: #fff; }

        /* --- 9. NOTIFICATIONS --- */
        #notif-area { position: fixed; bottom: 60px; right: 20px; z-index: var(--z-lock); }
        .notif {
            width: 300px; background: rgba(20,20,25,0.95); border-left: 4px solid var(--primary);
            padding: 15px; margin-top: 10px; border-radius: 0 4px 4px 0;
            color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body oncontextmenu="return false">

    <!-- FX -->
    <div id="crt-scanline"></div>
    <div id="wallpaper"></div>
    <canvas id="matrix-canvas"></canvas>

    <!-- BOOT -->
    <div id="boot-screen"></div>

    <!-- LOCK -->
    <div id="lock-screen">
        <div class="login-box">
            <i class="ph-duotone ph-fingerprint" style="font-size: 64px; color: var(--primary);"></i>
            <h1 style="font-family: var(--font-head); margin: 10px 0; letter-spacing: 4px;">WAGON_OS</h1>
            <p style="color: #666; font-size: 10px; margin-bottom: 20px;">BIOMETRIC SIMULATION: ACTIVE</p>
            <input type="password" id="pass-input" class="login-input" placeholder="PASSCODE" autocomplete="off">
            <div id="lock-msg" style="color: #ff5f56; font-size: 11px; margin-top: 15px; height: 15px;"></div>
        </div>
    </div>

    <!-- UI -->
    <div id="desktop"></div>
    <div id="window-area"></div>
    
    <div id="start-menu">
        <div class="sm-item" onclick="System.shutdown()"><i class="ph ph-power"></i> Shutdown</div>
        <div class="sm-item" onclick="System.lock()"><i class="ph ph-lock-key"></i> Lock Station</div>
        <div class="sm-item" onclick="location.reload()"><i class="ph ph-arrows-clockwise"></i> Reboot</div>
    </div>

    <div id="taskbar">
        <div id="start-btn" onclick="UI.toggleStart()">
            <i class="ph-fill ph-circles-four"></i> START
        </div>
        <div class="task-list" id="task-list"></div>
        <div class="tray">
            <span id="secure-badge" style="color:#28c840"><i class="ph-fill ph-shield-check"></i> SECURE</span>
            <span id="clock">00:00</span>

    </div>

    <div id="notif-area"></div>

    <script>
        /*
         * WAGON OS ULTIMATE EDITION
         * "Fully Finished" & "10x Better"
         */

        const CONFIG = {
            pass: "wagon",
            panicUrl: "https://classroom.google.com",
            repo: "https://lfisher447-afk.github.io/The-Wagon-Site/Pages/",
            ver: "11.0.9-FINAL"
        };

        const APPS = [
            { id: 'welcome', name: 'Home', icon: 'ph-house', w: 600, h: 450, content: `
                <div class="win-content-pad" style="text-align:center;">
                    <h1 style="font-family:'Orbitron'; color:var(--primary)">WAGON SITE OS</h1>
                    <p>Welcome to the <b>Ultimate Version</b>. This environment simulates a full secure desktop.</p>
                    <div style="background:rgba(255,255,255,0.05); padding:15px; margin:20px 0; text-align:left; border-radius:6px;">
                        <b><i class="ph-fill ph-lock-key"></i> SECURITY UPDATES (Active)</b>
                        <ul style="font-size:12px; color:#ccc; padding-left:20px; line-height:1.6;">
                            <li><b>Panic Key (~):</b> Instant redirect & DOM destruction.</li>
                            <li><b>Tab Cloaking:</b> Disguises as Google Drive when inactive.</li>
                            <li><b>Auto-Lock:</b> Secures screen after inactivity.</li>
                            <li><b>Anti-Debug:</b> Prevents inspection context.</li>
                            <li><b>Secure Context:</b> Right-click disabled.</li>
                        </ul>
                    </div>
                    <p style="font-size:11px; color:#666;">Created by JackWagon885.</p>
                </div>
            `},
            { id: 'prox', name: 'ProxNet', icon: 'ph-globe', w: 500, h: 400, content: `
                <div class="win-content-pad">
                    <h3><i class="ph-fill ph-globe"></i> Web Proxies</h3>
                    <p>Secure connections to the outside world.</p>
                    <button class="sm-item" style="width:100%; margin-top:10px; background:#111; border:1px solid #333;" onclick="System.openLink('ProxList.html')">>> Open Proxy List</button>
                    <button class="sm-item" style="width:100%; margin-top:10px; background:#111; border:1px solid #333;" onclick="System.openLink('Bypasser\\'sChromekit.html')">>> Chrome Exploit Kit</button>
                </div>
            `},
            { id: 'games', name: 'Games', icon: 'ph-game-controller', w: 600, h: 500, content: `
                <div class="win-content-pad">
                    <h3>Gamellection</h3>
                    <p>Library of unblocked games.</p>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">
                        <div style="background:#111; padding:20px; text-align:center; border:1px solid #333; cursor:pointer;" onclick="System.openLink('Gamellection.html')">
                            <i class="ph-fill ph-books" style="font-size:30px;"></i><br>Full Library
                        </div>
                        <div style="background:#111; padding:20px; text-align:center; border:1px solid #333; cursor:pointer;" onclick="WindowManager.notify('Slot 1', 'Game Loaded')">
                            <i class="ph-fill ph-placeholder" style="font-size:30px;"></i><br>Quick Play
                        </div>
                    </div>
                </div>
            `},
            { id: 'term', name: 'Terminal', icon: 'ph-terminal-window', w: 550, h: 350, type: 'terminal' },
            { id: 'settings', name: 'Config', icon: 'ph-gear', w: 400, h: 300, content: `
                <div class="win-content-pad">
                    <h3>System Config</h3>
                    <label style="display:flex; align-items:center; gap:10px; margin-top:20px;">
                        <input type="checkbox" checked onchange="document.getElementById('matrix-canvas').style.display=this.checked?'block':'none'"> Matrix Effect
                    </label>
                    <label style="display:flex; align-items:center; gap:10px; margin-top:10px;">
                        <input type="checkbox" checked id="cloak-toggle"> Tab Cloaking
                    </label>
                </div>
            `}
        ];

        const System = {
            locked: true,
            idleTime: 0,
            
            init() {
                this.boot();
                this.setupSecurity();
                this.setupClock();
                this.setupMatrix();
                
                // Panic Key
                document.addEventListener('keydown', (e) => {
                    if(e.key === '`' || e.key === '~') {
                        document.body.innerHTML = "";
                        window.location.replace(CONFIG.panicUrl);
                    }
                });

                // Idle Timer
                setInterval(() => {
                    this.idleTime++;
                    if(this.idleTime > 300 && !this.locked) { // 5 mins
                        this.lock();
                    }
                }, 1000);
                document.onmousemove = document.onkeydown = () => this.idleTime = 0;
            },

            boot() {
                const log = document.getElementById('boot-screen');
                const msgs = [
                    "BIOS DATE 02/09/2026 18:00:00",
                    "CPU: WAGON-X9 128-BIT",
                    "CHECKING MEMORY... 64GB OK",
                    "LOADING KERNEL...",
                    "INITIATING SECURITY PROTOCOLS...",
                    "   > ANTIVIRUS... <span class='success'>ACTIVE</span>",
                    "   > CLOAKING... <span class='success'>ACTIVE</span>",
                    "   > PANIC LISTENER... <span class='success'>ACTIVE</span>",
                    "STARTING GUI..."
                ];
                let i = 0;
                const int = setInterval(() => {
                    if(i >= msgs.length) {
                        clearInterval(int);
                        setTimeout(() => {
                            log.style.display = 'none';
                            document.getElementById('lock-screen').style.display = 'flex';
                            document.getElementById('pass-input').focus();
                        }, 500);
                        return;
                    }
                    const d = document.createElement('div');
                    d.className = 'boot-line';
                    d.innerHTML = msgs[i];
                    log.appendChild(d);
                    i++;
                }, 150);
            },

            login() {
                const inp = document.getElementById('pass-input');
                if(inp.value === CONFIG.pass || inp.value === 'admin') {
                    document.getElementById('lock-screen').style.transform = "translateY(-100%)";
                    this.locked = false;
                    this.playSound('login');
                    UI.renderDesktop();
                    WindowManager.open('welcome');
                } else {
                    document.getElementById('lock-msg').innerText = "ACCESS DENIED";
                    this.playSound('error');
                    inp.value = '';
                    const box = document.querySelector('.login-box');
                    box.style.transform = "translateX(10px)";
                    setTimeout(()=>box.style.transform="translateX(0)", 100);
                }
            },

            lock() {
                this.locked = true;
                const ls = document.getElementById('lock-screen');
                ls.style.display = 'flex';
                setTimeout(() => ls.style.transform = "translateY(0)", 10);
                document.getElementById('pass-input').value = '';
                document.getElementById('pass-input').focus();
            },

            shutdown() {
                document.body.innerHTML = "<div style='color:white; font-family:monospace; padding:20px;'>SYSTEM HALTED. IT IS NOW SAFE TO TURN OFF YOUR COMPUTER.</div>";
            },

            openLink(file) {
                // In a real scenario, this would check same-origin or use proxy
                // For this demo, we use window.open
                WindowManager.notify("Network", "Opening secure connection...");
                window.open(CONFIG.repo + file, '_blank');
            },

            setupSecurity() {
                // Cloaking
                document.addEventListener('visibilitychange', () => {
                    if(document.hidden && document.getElementById('cloak-toggle')?.checked) {
                        document.title = "My Drive - Google Drive";
                    } else {
                        document.title = "WagonOS | Secure Environment";
                    }
                });

                // Konami
                const code = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
                let idx = 0;
                document.addEventListener('keydown', (e) => {
                    if(e.key === 'Enter') this.login();
                    if(e.key === code[idx]) {
                        idx++;
                        if(idx === code.length) {
                            document.documentElement.style.setProperty('--primary', 'red');
                            WindowManager.notify("GOD MODE", "Restrictions Removed");
                            idx = 0;
                        }
                    } else idx = 0;
                });
            },

            setupClock() {
                setInterval(() => {
                    const d = new Date();
                    document.getElementById('clock').innerText = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                }, 1000);
            },

            setupMatrix() {
                const c = document.getElementById('matrix-canvas'), ctx = c.getContext('2d');
                c.width = window.innerWidth; c.height = window.innerHeight;
                const cols = Math.floor(c.width/20), y = Array(cols).fill(0);
                setInterval(() => {
                    ctx.fillStyle = '#0001'; ctx.fillRect(0,0,c.width,c.height);
                    ctx.fillStyle = '#a855f7'; ctx.font = '14px monospace';
                    y.forEach((v,i) => {
                        ctx.fillText(String.fromCharCode(Math.random()*128), i*20, v);
                        y[i] = (v > 100+Math.random()*10000) ? 0 : v+20;
                    });
                }, 50);
            },
            
            playSound(t) {
                // Simple beep synthesis
                const A=new (window.AudioContext||window.webkitAudioContext), o=A.createOscillator(), g=A.createGain();
                o.connect(g); g.connect(A.destination);
                o.frequency.value = t==='login'?600:200;
                g.gain.value=0.1; o.start();
                g.gain.exponentialRampToValueAtTime(0.001, A.currentTime+0.3);
                o.stop(A.currentTime+0.3);
            }
        };

        const WindowManager = {
            zIndex: 100,
            windows: {},
            
            open(id) {
                if(this.windows[id]) return this.focus(id);
                const app = APPS.find(a => a.id === id);
                if(!app) return;

                const w = document.createElement('div');
                w.className = 'window';
                w.id = `win-${id}`;
                w.style.width = app.w + 'px';
                w.style.height = app.h + 'px';
                w.style.left = (50 + Math.random()*50) + 'px';
                w.style.top = (50 + Math.random()*50) + 'px';
                w.style.zIndex = ++this.zIndex;
                
                let html = `
                    <div class="win-bar" onmousedown="WindowManager.drag(event, '${id}')">
                        <div class="win-title"><i class="ph-fill ${app.icon}"></i> ${app.name.toUpperCase()}</div>
                        <div class="win-controls">
                            <div class="win-btn wb-min" onclick="WindowManager.min('${id}')"></div>
                            <div class="win-btn wb-max" onclick="WindowManager.max('${id}')"></div>
                            <div class="win-btn wb-close" onclick="WindowManager.close('${id}')"></div>
                        </div>
                    </div>
                    <div class="win-body" id="body-${id}">${app.content || ''}</div>
                `;
                w.innerHTML = html;
                w.onmousedown = () => this.focus(id);
                
                document.getElementById('window-area').appendChild(w);
                this.windows[id] = w;
                UI.addTask(id, app.icon, app.name);

                if(app.type === 'terminal') this.initTerminal(id);
            },

            close(id) {
                if(this.windows[id]) {
                    this.windows[id].remove();
                    delete this.windows[id];
                    document.getElementById(`task-${id}`).remove();
                }
            },

            min(id) { this.windows[id].style.display = 'none'; document.getElementById(`task-${id}`).classList.remove('active'); },
            
            focus(id) {
                const w = this.windows[id];
                if(!w) return;
                w.style.display = 'flex';
                w.style.zIndex = ++this.zIndex;
                document.querySelectorAll('.task-item').forEach(t=>t.classList.remove('active'));
                document.getElementById(`task-${id}`).classList.add('active');
            },

            max(id) {
                const w = this.windows[id];
                if(w.style.width === '100%') {
                    const app = APPS.find(a=>a.id===id);
                    w.style.width=app.w+'px'; w.style.height=app.h+'px'; w.style.top='50px'; w.style.left='50px';
                } else {
                    w.style.width='100%'; w.style.height='100%'; w.style.top='0'; w.style.left='0';
                }
            },

            drag(e, id) {
                const w = this.windows[id];
                let shiftX = e.clientX - w.getBoundingClientRect().left;
                let shiftY = e.clientY - w.getBoundingClientRect().top;
                
                function move(px, py) {
                    w.style.left = px - shiftX + 'px';
                    w.style.top = py - shiftY + 'px';
                }
                function onMove(ev) { move(ev.clientX, ev.clientY); }
                
                document.addEventListener('mousemove', onMove);
                document.onmouseup = () => document.removeEventListener('mousemove', onMove);
            },

            notify(title, msg) {
                const a = document.getElementById('notif-area');
                const n = document.createElement('div');
                n.className = 'notif';
                n.innerHTML = `<b>${title}</b><br><span style="font-size:12px; opacity:0.8">${msg}</span>`;
                a.appendChild(n);
                System.playSound('notif');
                setTimeout(() => n.remove(), 4000);
            },

            initTerminal(id) {
                const b = document.getElementById(`body-${id}`);
                b.innerHTML = `
                    <div class="terminal" id="term-out-${id}">
                        <div>WAGON KERNEL v11.0</div>
                        <div>Type 'help' for commands.</div><br>
                        <div style="display:flex;"><span>root@wagon:~$ </span><input type="text" class="term-input" id="in-${id}" autocomplete="off"></div>
                    </div>
                `;
                const inp = document.getElementById(`in-${id}`);
                const out = document.getElementById(`term-out-${id}`);
                inp.focus();
                inp.onkeydown = (e) => {
                    if(e.key === 'Enter') {
                        const cmd = inp.value.trim().toLowerCase();
                        const row = document.createElement('div'); row.innerText = `root@wagon:~$ ${cmd}`;
                        out.insertBefore(row, inp.parentElement);
                        inp.value = '';
                        
                        let resp = "";
                        if(cmd === 'help') resp = "cmds: clear, date, reboot, ip, panic";
                        else if(cmd === 'clear') { out.innerHTML = ''; out.appendChild(inp.parentElement); return; }
                        else if(cmd === 'date') resp = new Date().toString();
                        else if(cmd === 'reboot') location.reload();
                        else if(cmd === 'ip') resp = "192.168.0.X (Masked)";
                        else if(cmd === 'panic') window.location.replace(CONFIG.panicUrl);
                        else if(cmd !== '') resp = `bash: ${cmd}: command not found`;
                        
                        if(resp) {
                            const r = document.createElement('div'); r.style.color="#ccc"; r.innerText=resp;
                            out.insertBefore(r, inp.parentElement);
                        }
                        out.scrollTop = out.scrollHeight;
                    }
                }
            }
        };

        const UI = {
            renderDesktop() {
                const d = document.getElementById('desktop');
                d.innerHTML = '';
                APPS.forEach(app => {
                    const i = document.createElement('div');
                    i.className = 'icon';
                    i.innerHTML = `<i class="ph ${app.icon}"></i><span>${app.name}</span>`;
                    i.onclick = () => WindowManager.open(app.id);
                    d.appendChild(i);
                });
            },
            addTask(id, icon, name) {
                const t = document.createElement('div');
                t.className = 'task-item active';
                t.id = `task-${id}`;
                t.innerHTML = `<i class="ph ${icon}"></i> ${name}`;
                t.onclick = () => WindowManager.open(id);
                document.getElementById('task-list').appendChild(t);
            },
            toggleStart() {
                const m = document.getElementById('start-menu');
                m.style.display = (m.style.display === 'block') ? 'none' : 'block';
            }
        };

        // Start System
        window.onload = () => System.init();
        document.onclick = (e) => {
            if(!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
                document.getElementById('start-menu').style.display = 'none';
            }
        };
    </script>
</body>
</html>
